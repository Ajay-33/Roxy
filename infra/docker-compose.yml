name: roxy

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: roxy
      POSTGRES_USER: roxy
      POSTGRES_PASSWORD: roxy_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - roxy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roxy -d roxy"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  roxy_postgres_data:

